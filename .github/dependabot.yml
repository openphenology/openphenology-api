# Handling follows the Technical Guide §5: patch and minor updates grouped,
# majors separate, and a 7-day wait except for security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the oldest supported Node.js line.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # typescript-eslint does not yet support TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
