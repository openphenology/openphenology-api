name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install test browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check
        run: pnpm check
      - name: Pack
        run: pnpm pack --out package.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package.tgz
          retention-days: 1

  install:
    name: Install (Node ${{ matrix.node }}, ${{ matrix.manager }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        manager: [npm, yarn]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Install and import with npm
        if: matrix.manager == 'npm'
        run: |
          mkdir consumer && cd consumer
          npm init -y
          npm install --no-audit --no-fund ../package.tgz
          node --input-type=module -e 'await import("@openphenology/api")'
      - name: Install and import with Yarn
        if: matrix.manager == 'yarn'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          npm install --global corepack@0.36.0
          mkdir consumer && cd consumer
          echo '{"name":"consumer","private":true,"packageManager":"yarn@4.18.1"}' > package.json
          corepack yarn add @openphenology/api@file:../package.tgz
          corepack yarn node --input-type=module -e 'await import("@openphenology/api")'

  ci:
    name: CI
    if: always()
    needs: [check, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
