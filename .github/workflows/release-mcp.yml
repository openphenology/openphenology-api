name: Release (MCP)

# Publishes @openphenology/mcp to npm when a tag such as mcp-v0.1.0 is pushed.
# The client's own tags (v*) never match, so each package is released on its
# own. npm trusted publishing authenticates with GitHub's OIDC token, so no npm
# token is stored.

on:
  push:
    tags: ["mcp-v*"]

concurrency:
  group: release-mcp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protection rules on this environment, such as required reviewers, gate the publish.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./packages/mcp/package.json").version')
          if [ "$TAG" != "mcp-v$version" ]; then
            echo "Tag $TAG does not match packages/mcp/package.json version $version" >&2
            exit 1
          fi
          if [ "$(node -p 'require("./packages/mcp/package.json").private === true')" = true ]; then
            echo "packages/mcp/package.json is still private" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG is not on main" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" packages/mcp/CHANGELOG.md; then
            echo "packages/mcp/CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install test browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check
        run: pnpm check
      # pnpm pack swaps workspace:^ for the client's published version range;
      # npm publish then uploads that file with trusted publishing.
      - name: Pack
        working-directory: packages/mcp
        run: pnpm pack --out mcp.tgz
      - name: Publish
        working-directory: packages/mcp
        run: npm publish mcp.tgz --access public
