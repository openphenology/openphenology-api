name: MCP (staging)

# Deploys the hosted MCP server to api-staging.openphenology.com/mcp after a
# change to main, or by hand. Production is not set up here; it needs the
# owner's approval (#44). Uses the `staging` environment, as openphenology/data
# does: the CF_ACCOUNT_ID variable and a CLOUDFLARE_API_TOKEN secret that can
# deploy Workers and set routes on openphenology.com.

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp/**"
      - "src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mcp-staging.yml"
  workflow_dispatch:

concurrency:
  group: mcp-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the environment is set up
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "The staging environment needs CF_ACCOUNT_ID and CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: packages/mcp
        run: pnpm dlx wrangler@4.148.0 deploy --env staging
      - name: Smoke test
        run: |
          curl -sS --fail-with-body -m 20 -X POST https://api-staging.openphenology.com/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | grep -q '"name":"openphenology"'
